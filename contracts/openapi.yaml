    DemoSeedImportReport:
      type: object
      additionalProperties: false
      required: [sources, publications, analyses, duplicates]
      properties:
        sources: {type: integer, minimum: 0}
        publications: {type: integer, minimum: 0}
        analyses: {type: integer, minimum: 0}
        duplicates: {type: integer, minimum: 0}

    SourceCollectionResult:
      type: object
      additionalProperties: false
      required:
        - source_id
        - status
        - collected
        - created
        - already_seen
        - content_duplicates
        - exact_duplicates
        - semantic_candidates
        - error
      properties:
        source_id: {type: string}
        status: {type: string, enum: [success, partial, failed]}
        collected: {type: integer, minimum: 0}
        created: {type: integer, minimum: 0}
        already_seen:
          type: integer
          minimum: 0
          description: Items skipped because source/external ID or canonical URL was already stored
        content_duplicates:
          type: integer
          minimum: 0
          description: Items skipped only because normalized content SHA-256 already existed
        exact_duplicates:
          type: integer
          minimum: 0
          deprecated: true
          description: Compatibility total equal to already_seen plus content_duplicates
        semantic_candidates: {type: integer, minimum: 0}
        error: {type: [string, "null"]}

    CollectionReport:
      type: object
      additionalProperties: false
      required:
        - status
        - started_at
        - finished_at
        - sources
        - collected
        - created
        - already_seen
        - content_duplicates
        - exact_duplicates
        - semantic_candidates
      properties:
        status:
          type: string
          enum: [completed, partial_failure, failed]
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        sources:
          type: array
          items: {$ref: "#/components/schemas/SourceCollectionResult"}
        collected: {type: integer, minimum: 0}
        created: {type: integer, minimum: 0}
        already_seen: {type: integer, minimum: 0}
        content_duplicates: {type: integer, minimum: 0}
        exact_duplicates:
          type: integer
          minimum: 0
          deprecated: true
          description: Compatibility total equal to already_seen plus content_duplicates
        semantic_candidates: {type: integer, minimum: 0}
